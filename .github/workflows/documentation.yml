name: "Documentation"

on:
  pull_request:
    branches:
      - "*.x"
    paths:
      - ".github/workflows/documentation.yml"
      - "docs/**"
  push:
    branches:
      - "*.x"
    paths:
      - ".github/workflows/documentation.yml"
      - "docs/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  documentation:
    name: "Documentation"
    uses: "doctrine/.github/.github/workflows/documentation.yml@v12.2.0"