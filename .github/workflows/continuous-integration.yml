name: "CI: PHPUnit"

on:
  pull_request:
    branches:
      - "*.x"
    paths:
      - .github/workflows/continuous-integration.yml
      - config/**
      - composer.*
      - phpunit.xml.dist
      - src/**
      - templates/**
      - tests/**
  push:
    branches:
      - "*.x"
    paths:
      - .github/workflows/continuous-integration.yml
      - config/**
      - composer.*
      - phpunit.xml.dist
      - src/**
      - templates/**
      - tests/**

jobs:
  phpunit:
    name: >
      ${{ format('PHP {0} - Sf {1} - deps {2} - stab. {3}',
        matrix.php-version || 'Ø',
        matrix.symfony-require || 'Ø',
        matrix.dependencies || 'Ø',
        matrix.stability || 'Ø'
      ) }}
      ${{ matrix.remove-orm && ' - remove ORM' }}
      ${{ matrix.remove-doctrine-messenger && ' - remove Messenger' }}
    runs-on: "ubuntu-latest"
    env:
      SYMFONY_REQUIRE: ${{matrix.symfony-require}}
      SYMFONY_DEPRECATIONS_HELPER: weak

    strategy:
      fail-fast: false
      matrix:
        php-version:
          - "8.1"
          - "8.2"
          - "8.3"
        dependencies:
          - "highest"
        stability:
          - "stable"
        symfony-require:
          - ""
        remove-orm:
          - false
        remove-doctrine-messenger:
          - false
        include:
          # Tests the lowest set of dependencies
          - dependencies: "lowest"
            stability: "stable"
            php-version: "8.1"

          # Test LTS
          - symfony-require: "6.4.*"
            dependencies: "highest"
            php-version: "8.4"

          # DBAL only without ORM
          - php-version: "8.4"
            dependencies: "highest"
            stability: "stable"
            remove-orm: true

          # No Messenger integration
          - php-version: "8.4"
            dependencies: "highest"
            stability: "stable"
            remove-doctrine-messenger: true

          # Bleeding edge
          - php-version: "8.4"
            dependencies: "highest"
            stability: "dev"

    steps:
      - name: "Checkout"
        uses: "actions/checkout@v6"
        with:
          fetch-depth: 2

      - name: "Install PHP with PCOV"
        uses: "shivammathur/setup-php@v2"
        with:
          php-version: "${{ matrix.php-version }}"
          coverage: "pcov"
          ini-file: "development"
          extensions: "pdo_sqlite"
          tools: "flex"

      - name: "Enforce using stable dependencies"
        run: "composer config minimum-stability stable"
        if: "${{ matrix.stability == 'stable' }}"

      - name: "Remove doctrine/orm"
        run: "composer remove doctrine/orm --dev --no-update"
        if: "${{ matrix.remove-orm }}"

      - name: "Remove symfony/doctrine-messenger"
        run: "composer remove symfony/doctrine-messenger --dev --no-update"
        if: "${{ matrix.remove-doctrine-messenger }}"

      - name: "Install dependencies with Composer"
        uses: "ramsey/composer-install@v4"
        with:
          dependency-versions: "${{ matrix.dependencies }}"
          composer-options: "--prefer-dist"

      - name: "Run PHPUnit"
        run: "vendor/bin/phpunit --coverage-clover=coverage.xml"

      - name: "Upload coverage file"
        uses: "actions/upload-artifact@v7"
        with:
          name: "phpunit-${{ matrix.php-version }}-${{ matrix.dependencies }}-${{ hashFiles('composer.lock') }}.coverage"
          path: "coverage.xml"

  upload_coverage:
    name: "Upload coverage to Codecov"
    runs-on: "ubuntu-latest"
    # Only run on PRs from forks or PRs from branches that do not match `*.x`
    if: "github.event.pull_request.head.repo.full_name != github.repository || !contains(github.event.pull_request.head.ref, '.x')"
    needs:
      - "phpunit"

    steps:
      - name: "Checkout"
        uses: "actions/checkout@v6"
        with:
          fetch-depth: 2

      - name: "Download coverage files"
        uses: "actions/download-artifact@v8"
        with:
          path: "reports"

      - name: "Upload to Codecov"
        uses: "codecov/codecov-action@v6"
        with:
          directory: reports
        env:
          CODECOV_TOKEN: "${{ secrets.CODECOV_TOKEN }}"
