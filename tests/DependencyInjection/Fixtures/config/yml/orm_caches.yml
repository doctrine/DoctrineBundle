services:
    cache.psr6:
        class: Symfony\Component\Cache\Adapter\ArrayAdapter

doctrine:
    dbal:
        default_connection: default
        connections:
            default:
                dbname: db
                server_version: 9.4.0

    orm:
        default_entity_manager: metadata_cache_none
        entity_managers:
            metadata_cache_none: ~
            metadata_cache_pool:
                metadata_cache_driver:
                    type: pool
                    pool: cache.psr6
            metadata_cache_service_psr6:
                metadata_cache_driver:
                    type: service
                    id: cache.psr6

            query_cache_pool:
                query_cache_driver:
                    type: pool
                    pool: cache.psr6
            query_cache_service_psr6:
                query_cache_driver:
                    type: service
                    id: cache.psr6

            result_cache_pool:
                result_cache_driver:
                    type: pool
                    pool: cache.psr6
            result_cache_service_psr6:
                result_cache_driver:
                    type: service
                    id: cache.psr6

            second_level_cache_pool:
                second_level_cache:
                    enabled: true
                    region_cache_driver:
                        type: pool
                        pool: cache.psr6
            second_level_cache_service_psr6:
                second_level_cache:
                    enabled: true
                    region_cache_driver:
                        type: service
                        id: cache.psr6
