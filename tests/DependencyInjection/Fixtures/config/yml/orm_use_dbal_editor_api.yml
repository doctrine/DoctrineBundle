doctrine:
    dbal:
        default_connection: default
        connections:
            default:
                dbname: db

    orm:
        default_entity_manager: em1
        entity_managers:
            em1:
                mappings:
                    XmlBundle: ~
                use_dbal_editor_api: true
            em2:
                mappings:
                    XmlBundle: ~
                use_dbal_editor_api: false
